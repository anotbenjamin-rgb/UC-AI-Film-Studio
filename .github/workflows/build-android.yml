name: Build UC Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create UC Android wrapper
        run: |
          mkdir -p www
          echo '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > www/index.html
          cat > package.json <<'EOF'
          {
            "name": "uc-ai-film-studio",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.3"
            }
          }
          EOF
          npm install
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.ucfilmstudio.app',
            appName: 'UC AI Film Studio',
            webDir: 'www',
            server: {
              url: 'https://ai-film-studio-o3wkvd.v2.appdeploy.ai',
              cleartext: false
            }
          };
          export default config;
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: UC-AI-Film-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
    
